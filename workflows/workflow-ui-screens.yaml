# Run it from the root of the repository:
#
#   swamp workflow run ui-screens
#
# The step runs `scripts/ui-screens.ts`, which describes its options. The
# `ui-review` skill reads the files that it writes.
id: c10c2de6-58ee-4a8e-8c97-bedbb7077e7f
name: ui-screens
description: >-
  Take screenshots and measurements of each page on fake data, at two widths
  in the light and the dark theme.
version: 1
jobs:
  - name: capture
    description: Take each screen into frontend/.browser-test/screens/current/.
    steps:
      - name: capture
        task:
          type: model_method
          modelType: command/shell
          modelName: ui-screens-capture
          methodName: execute
          inputs:
            run: pnpm run ui:screens
