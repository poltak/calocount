name: CI

# A branch gets CI through its pull request. With a push trigger for each
# branch, a pull request runs every check two times.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The three jobs run at the same time, so a run takes as long as its slowest
# job and not as long as their sum. Each job must do the setup steps itself.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      # No step sets up Node. pnpm downloads the Node version in
      # `devEngines.runtime` and runs each script on it. pnpm itself runs on the
      # Node of the runner image.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run ci:checks

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter frontend run test

  browser:
    name: Browser tests and live start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This command has no `--with-deps`. The runner image has each system
      # library that the browser needs, and the flag adds only fonts there and
      # takes 20 seconds. If a new image cannot start the browser, add the flag.
      - name: Install the browser for the browser tests
        run: pnpm run test:browser:install

      - name: Run browser tests
        run: pnpm run test:browser --forbid-only

      - name: Start the live server
        run: pnpm run test:live-start
