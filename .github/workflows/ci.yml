name: CI

# A branch gets CI through its pull request. With a push trigger for each
# branch, a pull request runs every check two times.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      # This command has no `--with-deps`. The runner image has each system
      # library that the browser needs, and the flag adds only fonts there and
      # takes 20 seconds. If a new image cannot start the browser, add the flag.
      - name: Install the browser for the browser tests
        run: pnpm run test:browser:install

      - name: Run browser tests
        run: pnpm run test:browser --forbid-only

      - name: Start the live server
        run: pnpm run test:live-start
