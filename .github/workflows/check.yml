name: Checks

on:
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Run checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: legacy/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir legacy install --frozen-lockfile

      - name: Install browser
        run: pnpm --dir legacy exec playwright install --with-deps chromium

      - name: Run checks
        run: pnpm --dir legacy run check
