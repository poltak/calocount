name: Deploy production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    # A copy made with the Deploy to Cloudflare button deploys with Workers Builds instead.
    if: github.repository == 'poltak/calocount'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: legacy/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir legacy install --frozen-lockfile

      - name: Install browser
        run: pnpm --dir legacy exec playwright install --with-deps chromium

      - name: Run checks
        run: pnpm --dir legacy run check

      - name: Dry-run deployment
        run: pnpm --dir legacy run deploy:dry

      # Builds, applies the remote D1 migrations, then deploys the Worker.
      - name: Deploy Worker
        run: pnpm --dir legacy run deploy
