packages:
  - backend
  - frontend
  - common

# The embedded PostgreSQL for development has one package for each platform.
# Its install script makes the symlinks that the binaries need.
allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  simple-git-hooks: true
  # Its install script downloads the bd binary of the pinned version from the
  # GitHub release of beads. Without it, `pnpm exec bd` has no binary to run.
  "@beads/bd": true

engineStrict: true

# 3 days, in minutes. Keep it equal to `minimumReleaseAge` in renovate.json.
# Renovate cannot apply its rule to indirect dependencies, so pnpm applies
# this one to each package. An install fails when a version in the lockfile
# is less than 3 days old.
minimumReleaseAge: 4320
