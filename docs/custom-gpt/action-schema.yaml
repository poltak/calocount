openapi: 3.1.0

info:
  title: Calocount Meal API
  description: Adds meals, detailed nutrition estimates, and optional meal photos to the user's personal tracker.
  version: 1.2.0

servers:
  - url: https://YOUR-CALOCOUNT-HOST.example.com

paths:
  /api/add-meal:
    post:
      operationId: addMeal
      summary: Add a meal to Calocount
      description: >
        Adds one or more meals to the user's personal tracker. Calories and
        macros are required. Detailed nutrients and one user-uploaded meal
        image per meal are optional. Call this operation when the user's
        logging intent is explicit. The response includes the current logical
        day's calorie and protein totals.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MealRequest"
                - $ref: "#/components/schemas/BatchMealRequest"
      responses:
        "200":
          description: >
            Meal logging result. This status is returned for an idempotent
            retry, or for a batch in which every request UUID already exists.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SingleMealResponse"
                  - $ref: "#/components/schemas/BatchMealResponse"
        "201":
          description: At least one new meal was created.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SingleMealResponse"
                  - $ref: "#/components/schemas/BatchMealResponse"
        "400":
          description: Invalid meal data, batch, or image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image payload is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Required endpoint configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MealRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - name
        - kcal
        - protein
        - carbs
        - fat
        - eaten_at
      properties:
        request_id:
          type: string
          format: uuid
          description: >
            UUID generated for this meal logging request. Reuse the same UUID
            only when retrying the same request.
        name:
          type: string
          maxLength: 200
          description: Concise human-readable description of the meal.
        kcal:
          type: number
          minimum: 0
          maximum: 100000
          description: Estimated calories in kilocalories for the full meal.
        protein:
          type: number
          minimum: 0
          maximum: 10000
          description: Estimated protein in grams for the full meal.
        carbs:
          type: number
          minimum: 0
          maximum: 10000
          description: Estimated carbohydrates in grams for the full meal.
        fat:
          type: number
          minimum: 0
          maximum: 10000
          description: Estimated fat in grams for the full meal.
        eaten_at:
          type: string
          format: date-time
          description: Time the meal was eaten in ISO 8601 format, including its UTC offset.
        nutrients:
          $ref: "#/components/schemas/Nutrients"
        openaiFileIdRefs:
          type: array
          maxItems: 1
          description: >
            Optional user-uploaded image reference for this meal. The Custom
            GPT file upload flow supplies the reference metadata. Send at most
            one original meal photo. Supported images are JPEG, PNG, or WEBP.
          items:
            $ref: "#/components/schemas/OpenAIFileRef"

    BatchMealRequest:
      type: object
      additionalProperties: false
      required:
        - meals
      properties:
        meals:
          type: array
          minItems: 1
          maxItems: 20
          description: >
            Meals to add atomically. Each request_id must be unique in this
            array. A retry with the same request IDs returns already_exists for
            the entries already stored and does not create duplicates.
          items:
            $ref: "#/components/schemas/MealRequest"

    OpenAIFileRef:
      type: object
      additionalProperties: false
      required:
        - mime_type
        - download_link
      properties:
        id:
          type: string
        name:
          type: string
        mime_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        download_link:
          type: string
          format: uri

    DailyTotals:
      type: object
      additionalProperties: false
      required:
        - date
        - kcal
        - protein
        - meal_count
      properties:
        date:
          type: string
          format: date
          description: Current logical date in the user's saved timezone.
        kcal:
          type: number
          minimum: 0
          description: Total calories logged for the logical day.
        protein:
          type: number
          minimum: 0
          description: Total protein in grams logged for the logical day.
        meal_count:
          type: integer
          minimum: 0
          description: Number of complete meals logged for the logical day.

    MealResult:
      type: object
      required:
        - status
        - meal_id
        - request_id
        - name
        - kcal
        - protein
        - carbs
        - fat
        - eaten_at
        - has_image
      properties:
        status:
          type: string
          enum:
            - created
            - already_exists
        meal_id:
          type: string
        request_id:
          type: string
          format: uuid
        name:
          type: string
        kcal:
          type: number
        protein:
          type: number
        carbs:
          type: number
        fat:
          type: number
        eaten_at:
          type: string
          format: date-time
        has_image:
          type: boolean
        photo_status:
          type: string
          enum:
            - download_failed

    SingleMealResponse:
      allOf:
        - $ref: "#/components/schemas/MealResult"
        - type: object
          required:
            - daily_totals
          properties:
            daily_totals:
              $ref: "#/components/schemas/DailyTotals"

    BatchMealResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - created_count
        - already_exists_count
        - meals
        - daily_totals
      properties:
        status:
          type: string
          enum:
            - batch_processed
        created_count:
          type: integer
          minimum: 0
        already_exists_count:
          type: integer
          minimum: 0
        meals:
          type: array
          items:
            $ref: "#/components/schemas/MealResult"
        daily_totals:
          $ref: "#/components/schemas/DailyTotals"

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string

    Nutrients:
      type: object
      additionalProperties: false
      description: >
        Optional detailed nutrition totals for the full meal. Include a field
        only when there is a useful estimate. Omit unknown fields. A value of
        zero means that the nutrient is known to be absent.
      properties:
        fiberG:
          type: number
          minimum: 0
          maximum: 100000
          description: Total dietary fiber in grams.
        totalSugarsG:
          type: number
          minimum: 0
          maximum: 100000
          description: Total sugars in grams, including natural and added sugars.
        saturatedFatG:
          type: number
          minimum: 0
          maximum: 100000
          description: Saturated fat in grams.
        monounsaturatedFatG:
          type: number
          minimum: 0
          maximum: 100000
          description: Monounsaturated fat in grams.
        polyunsaturatedFatG:
          type: number
          minimum: 0
          maximum: 100000
          description: Polyunsaturated fat in grams.
        omega3G:
          type: number
          minimum: 0
          maximum: 100000
          description: Total omega-3 fatty acids in grams. Do not split this into ALA, EPA, or DHA.
        cholesterolMg:
          type: number
          minimum: 0
          maximum: 1000000
          description: Cholesterol in milligrams.
        vitaminAMcgRae:
          type: number
          minimum: 0
          maximum: 10000000
          description: Vitamin A in micrograms of retinol activity equivalents (mcg RAE).
        vitaminCMg:
          type: number
          minimum: 0
          maximum: 1000000
          description: Vitamin C in milligrams.
        vitaminDMcg:
          type: number
          minimum: 0
          maximum: 100000
          description: Vitamin D in micrograms.
        vitaminEMg:
          type: number
          minimum: 0
          maximum: 1000000
          description: Vitamin E in milligrams.
        vitaminKMcg:
          type: number
          minimum: 0
          maximum: 1000000
          description: Vitamin K in micrograms.
        vitaminB6Mg:
          type: number
          minimum: 0
          maximum: 100000
          description: Vitamin B6 in milligrams.
        folateMcgDfe:
          type: number
          minimum: 0
          maximum: 1000000
          description: Folate in micrograms of dietary folate equivalents (mcg DFE).
        vitaminB12Mcg:
          type: number
          minimum: 0
          maximum: 100000
          description: Vitamin B12 in micrograms.
        sodiumMg:
          type: number
          minimum: 0
          maximum: 10000000
          description: Sodium in milligrams.
        potassiumMg:
          type: number
          minimum: 0
          maximum: 10000000
          description: Potassium in milligrams.
        calciumMg:
          type: number
          minimum: 0
          maximum: 10000000
          description: Calcium in milligrams.
        ironMg:
          type: number
          minimum: 0
          maximum: 100000
          description: Iron in milligrams.
        magnesiumMg:
          type: number
          minimum: 0
          maximum: 10000000
          description: Magnesium in milligrams.
        phosphorusMg:
          type: number
          minimum: 0
          maximum: 10000000
          description: Phosphorus in milligrams.
        zincMg:
          type: number
          minimum: 0
          maximum: 100000
          description: Zinc in milligrams.
        seleniumMcg:
          type: number
          minimum: 0
          maximum: 100000
          description: Selenium in micrograms.
        caffeineMg:
          type: number
          minimum: 0
          maximum: 100000
          description: Caffeine in milligrams.
